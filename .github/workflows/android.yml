name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Ensure Capacitor Packages
        run: npm install @capacitor/core @capacitor/cli @capacitor/android --save --legacy-peer-deps

      - name: Build Web Application
        run: npm run build || npx vite build

      - name: Initialize and Sync Android
        run: |
          npx cap init "AlAfdal" "com.alafdal.center" --web-dir dist || true
          npx cap add android || true
          npx cap sync android

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Make Gradle Executable
        run: |
          if [ -d "android" ]; then
            chmod +x android/gradlew
          fi

      - name: Build APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlAfdal-Center-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
